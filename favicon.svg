<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F2444"/>
      <stop offset="100%" stop-color="#060F1E"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- 背景深藍圓盤 -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="#38BDF8" stroke-width="12"/>
  
  <!-- 棒球縫線 (左弧與右弧) -->
  <path d="M 120 70 C 190 180 190 332 120 442" fill="none" stroke="#FF334B" stroke-width="10" stroke-dasharray="16,10" stroke-linecap="round"/>
  <path d="M 392 70 C 322 180 322 332 392 442" fill="none" stroke="#FF334B" stroke-width="10" stroke-dasharray="16,10" stroke-linecap="round"/>
  
  <!-- 雷達同心圓掃描環 -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="3" stroke-dasharray="8,8"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="rgba(56, 189, 248, 0.35)" stroke-width="3"/>
  
  <!-- 微疲勞先行心電脈衝波 (Neon Cyan) -->
  <polyline points="70,256 180,256 210,170 240,340 270,210 295,290 320,256 442,256" 
            fill="none" stroke="#38BDF8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
            
  <!-- 警戒中心亮點 (Crimson Pulse Dot) -->
  <circle cx="240" cy="340" r="14" fill="#FF334B" filter="url(#glow)"/>
  <circle cx="210" cy="170" r="14" fill="#38BDF8" filter="url(#glow)"/>
</svg>